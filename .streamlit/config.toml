# =====================================================
# MEU FINANCEIRO — SOFT BLUE FINTECH
# Temas Claro e Escuro alternáveis pelo menu do Streamlit.
# =====================================================

[theme]
# Aparência inicial. O usuário poderá alternar no menu do app.
base = "light"
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showSidebarBorder = true
showWidgetBorder = true

# -----------------------------------------------------
# TEMA CLARO
# -----------------------------------------------------
[theme.light]
primaryColor = "#456987"
backgroundColor = "#F3F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#293B4D"
linkColor = "#456987"
borderColor = "#E2E8EF"
dataframeBorderColor = "#E2E8EF"
dataframeHeaderBackgroundColor = "#E8F0F7"
dataframeHeaderTextColor = "#293B4D"
codeBackgroundColor = "#EAF0F5"
codeTextColor = "#293B4D"
chartCategoricalColors = ["#6386A8", "#39805B", "#D6A34A", "#BD5D51", "#96A9BC"]
blueColor = "#6386A8"
blueBackgroundColor = "#E8F0F7"
blueTextColor = "#365A78"
greenColor = "#39805B"
greenBackgroundColor = "#EAF4ED"
greenTextColor = "#286346"
yellowColor = "#D6A34A"
yellowBackgroundColor = "#FFF4E3"
yellowTextColor = "#8A5E19"
orangeColor = "#C88736"
orangeBackgroundColor = "#FFF0DF"
orangeTextColor = "#87531C"
redColor = "#BD5D51"
redBackgroundColor = "#FBECE9"
redTextColor = "#8F3F36"
grayColor = "#8796A5"
grayBackgroundColor = "#EDF1F5"
grayTextColor = "#526273"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F9"
primaryColor = "#456987"
textColor = "#293B4D"
linkColor = "#456987"
borderColor = "#E2E8EF"

# -----------------------------------------------------
# TEMA ESCURO
# -----------------------------------------------------
